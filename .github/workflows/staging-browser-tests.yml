name: Staging browser tests

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: staging-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Sparkable / staging' &&
      github.event.deployment.creator.login == 'railway-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging-browser-tests
      deployment: false
    env:
      CI: '1'
      SPARKABLE_BROWSER_BASE_URL: https://sparkable-staging.up.railway.app
      SPARKABLE_BROWSER_POST_URL: ${{ vars.SPARKABLE_BROWSER_POST_URL }}
      SPARKABLE_BROWSER_STORAGE_STATE: .playwright/auth.json
      SPARKABLE_TEST_HANDLE: ${{ vars.SPARKABLE_TEST_HANDLE }}
      SPARKABLE_TEST_PASSWORD: ${{ secrets.SPARKABLE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Check test configuration
        run: |
          test -n "$SPARKABLE_BROWSER_POST_URL" || { echo 'Missing SPARKABLE_BROWSER_POST_URL variable'; exit 1; }
          test -n "$SPARKABLE_TEST_HANDLE" || { echo 'Missing SPARKABLE_TEST_HANDLE variable'; exit 1; }
          test -n "$SPARKABLE_TEST_PASSWORD" || { echo 'Missing SPARKABLE_TEST_PASSWORD secret'; exit 1; }
      - name: Sign in to staging
        run: node scripts/browser-login.mjs
      - name: Run browser tests
        run: pnpm test:browser
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-browser-failures
          path: test-results/
          retention-days: 7
      - name: Delete saved session
        if: always()
        run: rm -f .playwright/auth.json
